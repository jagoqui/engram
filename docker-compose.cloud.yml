# Engram Cloud — local smoke / dev stack. Defaults below reproduce the
# original insecure dev smoke profile exactly, so a plain
# `docker compose -p engram-cloud -f docker-compose.cloud.yml up` still behaves the same as
# before these vars existed. Every value is overridable from an env file so
# this same compose file can run on a real server. See docker/cloud/env.example
# and docs/engram-cloud/quickstart.md.
#
# Usage (dev smoke, unchanged):
#   docker compose -p engram-cloud -f docker-compose.cloud.yml up -d
#
# Usage (configured, e.g. production-leaning):
#   cp docker/cloud/env.example .env.cloud
#   docker compose -p engram-cloud --env-file .env.cloud -f docker-compose.cloud.yml up -d
#
# Always pass `-p engram-cloud`: the containers use fixed container_name
# values, and the default project name (this directory) would collide with
# the engram-http stack's project. Add `--profile tls` for the TLS proxy.
#
# .env.cloud is a separate file from the engram-http stack's root `.env` so
# the two stacks' secrets never collide when both run from this directory.

services:
  postgres:
    image: postgres:16-alpine
    container_name: engram-cloud-postgres
    # POSTGRES_USER/PASSWORD/DB only take effect on a FRESH engram-cloud-pg
    # volume (initdb runs once). Changing them later does not alter an
    # existing database; reset the password inside Postgres or recreate the
    # volume (destroys data).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engram_dev}
      POSTGRES_DB: ${POSTGRES_DB:-engram_cloud}
    ports:
      - "127.0.0.1:${ENGRAM_CLOUD_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engram} -d ${POSTGRES_DB:-engram_cloud}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - engram-cloud-pg:/var/lib/postgresql/data

  cloud:
    build:
      context: .
      dockerfile: docker/cloud/Dockerfile
    container_name: engram-cloud
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The default URL interpolates POSTGRES_PASSWORD verbatim, so it must
      # be URL-safe (`openssl rand -hex 32` is); otherwise set
      # ENGRAM_DATABASE_URL explicitly with a percent-encoded password.
      ENGRAM_DATABASE_URL: ${ENGRAM_DATABASE_URL:-postgres://${POSTGRES_USER:-engram}:${POSTGRES_PASSWORD:-engram_dev}@postgres:5432/${POSTGRES_DB:-engram_cloud}?sslmode=disable}
      ENGRAM_JWT_SECRET: ${ENGRAM_JWT_SECRET:-engram-dev-jwt-secret-for-local-smoke-1234}
      # Only exactly "0" enables authentication. Unset AND empty
      # (`ENGRAM_CLOUD_INSECURE_NO_AUTH=`) both fall back to "1" (insecure
      # dev mode) because of `:-`; always set it explicitly on a server.
      ENGRAM_CLOUD_INSECURE_NO_AUTH: ${ENGRAM_CLOUD_INSECURE_NO_AUTH:-1}
      ENGRAM_CLOUD_ALLOWED_PROJECTS: ${ENGRAM_CLOUD_ALLOWED_PROJECTS:-smoke-project}
      ENGRAM_CLOUD_HOST: 0.0.0.0
      ENGRAM_PORT: "18080"
      # Legacy bearer token. NOTE: authenticated `cloud serve` (i.e. when
      # ENGRAM_CLOUD_INSECURE_NO_AUTH is not "1") currently REQUIRES this to
      # be set even when clients authenticate with managed tokens instead.
      # Empty is fine in the default insecure-smoke profile.
      ENGRAM_CLOUD_TOKEN: ${ENGRAM_CLOUD_TOKEN:-}
      # Dedicated secret for managed (bootstrap-issued) tokens. Empty means
      # managed-token auth stays disabled; the server still starts fine.
      ENGRAM_CLOUD_TOKEN_PEPPER: ${ENGRAM_CLOUD_TOKEN_PEPPER:-}
      # Legacy dashboard admin token. Must stay empty while
      # ENGRAM_CLOUD_INSECURE_NO_AUTH=1 (the server refuses to start
      # otherwise); only set it in authenticated mode.
      ENGRAM_CLOUD_ADMIN: ${ENGRAM_CLOUD_ADMIN:-}
    ports:
      - "${ENGRAM_CLOUD_BIND_ADDR:-127.0.0.1}:${ENGRAM_CLOUD_PUBLISHED_PORT:-18080}:18080"
    command: ["cloud", "serve"]

  # Optional TLS reverse proxy in front of `cloud` (T7). engram's cloud
  # client refuses to send a bearer token over plaintext HTTP
  # (internal/cloud/remote/transport.go), so an engram-http container in
  # cloud mode needs this to talk to `cloud` — either locally (Caddy's own
  # CA, "tls internal") or on a real server (ACME/Let's Encrypt, "tls
  # <email>"). Off by default: only starts with `--profile tls`, so a plain
  # `docker compose -p engram-cloud -f docker-compose.cloud.yml up` is unaffected. See
  # docs/engram-cloud/quickstart.md#local-https-with-the-tls-profile.
  caddy:
    image: caddy:2-alpine
    container_name: engram-cloud-caddy
    profiles: ["tls"]
    depends_on:
      - cloud
    environment:
      ENGRAM_CLOUD_TLS_HOSTS: ${ENGRAM_CLOUD_TLS_HOSTS:-localhost, host.docker.internal}
      ENGRAM_CLOUD_TLS: ${ENGRAM_CLOUD_TLS:-internal}
    volumes:
      - ./docker/cloud/Caddyfile:/etc/caddy/Caddyfile:ro
      - engram-cloud-caddy-data:/data
      - engram-cloud-caddy-config:/config
    # 443 serves HTTPS (TLS-ALPN-01 needs only this one). The HTTP port
    # serves the http->https redirect and is required for ACME HTTP-01 on a
    # server: set ENGRAM_CLOUD_TLS_PORT=443 and ENGRAM_CLOUD_TLS_HTTP_PORT=80.
    # BIND_ADDR: 127.0.0.1 (default) is host-only; 172.17.0.1 (Docker bridge
    # gateway) is reachable from containers via host.docker.internal but not
    # from the LAN; 0.0.0.0 exposes it to every interface (firewall it).
    ports:
      - "${ENGRAM_CLOUD_TLS_BIND_ADDR:-127.0.0.1}:${ENGRAM_CLOUD_TLS_PORT:-18443}:443"
      - "${ENGRAM_CLOUD_TLS_BIND_ADDR:-127.0.0.1}:${ENGRAM_CLOUD_TLS_HTTP_PORT:-18088}:80"

volumes:
  engram-cloud-pg:
  engram-cloud-caddy-data:
  engram-cloud-caddy-config:
