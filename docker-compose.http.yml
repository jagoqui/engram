# Engram HTTP — streamable MCP over HTTP in a container, no binary on the
# host. Personal/single-user deployment; NOT a multi-tenant hosted MCP
# server. See docs/engram-http/README.md for client config, auth modes, and
# the "adopt an existing data dir" section.
#
# Usage:
#   cp docker/http/env.example .env   # optional — only needed for a local
#                                      # token or cloud sync
#   docker compose -f docker-compose.http.yml up -d
#   curl http://127.0.0.1:7438/health
#
# On a real server, set ENGRAM_HTTP_BIND_ADDR (default 127.0.0.1) and
# ENGRAM_HTTP_PUBLISHED_PORT (default 7438) in .env to publish beyond
# loopback — see docs/engram-http/README.md#security. The container's
# internal listen address is fixed at 0.0.0.0:7438 (see docker/http/Dockerfile);
# only the published host bind/port are configurable.
#
# Cleanup:
#   docker compose -f docker-compose.http.yml down -v

services:
  engram-http:
    build:
      context: .
      dockerfile: docker/http/Dockerfile
    container_name: engram-http
    environment:
      ENGRAM_DATA_DIR: /data
      # Trust the system roots plus any extra CA dropped into docker/http/ca
      # (e.g. the local Caddy CA from docker-compose.cloud.yml's `tls`
      # profile). Go honors a colon-separated SSL_CERT_DIR.
      SSL_CERT_DIR: /etc/ssl/certs:/usr/local/share/engram-ca
    env_file:
      - path: .env
        required: false
    ports:
      - "${ENGRAM_HTTP_BIND_ADDR:-127.0.0.1}:${ENGRAM_HTTP_PUBLISHED_PORT:-7438}:7438"
    # Reaches a cloud stack published on the same host (e.g.
    # docker-compose.cloud.yml) via the Docker Desktop / Docker Engine
    # gateway hostname. Harmless when cloud mode isn't configured; only
    # takes effect if ENGRAM_CLOUD_SERVER in .env points at
    # host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - engram-http-data:/data
      - ./docker/http/ca:/usr/local/share/engram-ca:ro
      # --- Adopt an existing engram data dir instead of the named volume ---
      # WARNING: never bind-mount a data dir a HOST `engram` process is also
      # using live. SQLite WAL -shm/-wal locking is unreliable across the
      # Docker Desktop VM boundary on macOS/Windows, and two writers can
      # corrupt the database even on Linux. Stop the host engram first (or
      # point this at a COPY of ~/.engram), and chown the directory to uid
      # 10001 (or set `user: "10001:10001"` on this service) so the
      # container can write to it. See
      # docs/engram-http/README.md#adopt-an-existing-engram-data-dir.
      # - ${HOME}/.engram:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7438/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # To sync this container with a running Engram Cloud instance (separate
    # image — see docker-compose.cloud.yml), set ENGRAM_CLOUD_AUTOSYNC=1 and
    # ENGRAM_CLOUD_SERVER in .env (ENGRAM_CLOUD_TOKEN is optional — see
    # docker/http/env.example). For a cloud stack on this same host, point
    # ENGRAM_CLOUD_SERVER at https://host.docker.internal:18443 (the cloud
    # stack's `tls` profile — engram never sends a bearer over plaintext
    # http; the extra_hosts entry above makes that hostname resolve, and
    # docs/engram-http/README.md#cloud-mode covers the CA and bind address);
    # for a remote
    # cloud, use its real URL and drop extra_hosts if you prefer. This file
    # never merges the cloud and http services — they stay two independent
    # images/compose stacks. See docs/engram-cloud/README.md.

volumes:
  engram-http-data:
